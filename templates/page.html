{% extends "base.html" %}
{% block title %}{{ page.title }} — {{ site.name }}{% endblock %}
{% block description %}{{ page.description | default(site.description) }}{% endblock %}
{% block content %}
<article class="page container-narrow">
  <h1>{{ page.title }}</h1>
  <div class="article-body">
    {{ page.body_html | safe }}
  </div>
</article>
{% endblock %}
